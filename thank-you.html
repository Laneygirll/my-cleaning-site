<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! - Free Estimate Received</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b192c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background-color: #132743;
            padding: 50px 40px;
            border-radius: 12px;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid #d4af37;
        }
        .checkmark {
            font-size: 60px;
            color: #d4af37;
            margin-bottom: 15px;
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: 32px;
            color: #ffffff;
        }
        p {
            color: #d1d5db;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #d4af37;
            color: #0b192c;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #e5c158;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="checkmark">✓</div>
        <h1>Thank You!</h1>
        <p>We have received your free estimate request. Our team will review your details and contact you shortly.</p>
        <a href="index.html" class="btn">Back to Home</a>
    </div>
</body>
</html>
